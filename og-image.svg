<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="100%" stop-color="#121B25"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="3" fill="#B08D57"/>

  <!-- Logo officiel (3 polygones du kit de marque) -->
  <g transform="translate(80, 130) scale(1.6)">
    <polygon points="26,10 50,27 74,10 74,24 50,41 26,24" fill="#F5891F"/>
    <polygon points="10,33 50,50 90,33 90,47 50,64 10,47" fill="#F6F2EA"/>
    <polygon points="10,58 50,75 90,58 90,72 50,89 10,72" fill="#F6F2EA"/>
  </g>

  <!-- Product name -->
  <text x="80" y="305" font-family="Georgia,'Times New Roman',serif" font-size="88" font-weight="400" fill="#F6F2EA" letter-spacing="-2">Trustline</text>

  <!-- Tagline -->
  <text x="82" y="366" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="300" fill="#9A9488" letter-spacing="1.2">Certificate Lifecycle Management</text>

  <!-- Divider -->
  <line x1="80" y1="414" x2="520" y2="414" stroke="#B08D57" stroke-width="1" opacity="0.4"/>

  <!-- Key benefits -->
  <text x="80" y="456" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#8E9AA8">Inventaire CT · Score de maturité · Alertes expiration · Zéro donnée transmise</text>

  <!-- URL -->
  <text x="80" y="568" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#C9A671" letter-spacing="0.4">trustline.identity-ops.com</text>
</svg>
